# Checks every pull request with the tori CLI itself, the same loaders the app
# runs. The newest tori release checks every pack offline, builds the index (so
# a schema_version missing from tori-support.json fails here, not at publish),
# and downloads and hashes the changed packs' assets and looks up their pinned
# packages. The oldest release tori-support.json names loads only the packs
# whose min_tori is that release: a pack at a newer schema is not its to read.
# Theme legibility is measured only in the app's TypeScript, so the newest
# release's source also runs its contrast gate over every theme.
#
# No secrets and a read-only token: this runs on contributors' files.
name: Validate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The contrast check runs Tori's own TypeScript under Node's type stripping.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check theme contrast with the newest Tori
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          newest=$(gh release list --repo gettori/tori --limit 30 --exclude-drafts --json tagName \
            -q '[.[].tagName | select(startswith("macos-v") or startswith("v"))][0]')
          src="$RUNNER_TEMP/tori-src"
          mkdir -p "$src"
          gh api "repos/gettori/tori/tarball/$newest" > "$RUNNER_TEMP/tori-src.tgz"
          tar -xzf "$RUNNER_TEMP/tori-src.tgz" --strip-components=1 -C "$src"
          if [ -f "$src/scripts/check-theme-contrast.mjs" ]; then
            node "$src/scripts/check-theme-contrast.mjs" themes
          else
            echo "tori $newest predates the contrast check, skipped"
          fi

      - name: Validate with each supported Tori
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          oldest=$(jq -r '[.[][]] | unique | .[]' tori-support.json | sort -V | head -1)
          changed=$(git diff --name-only --diff-filter=d "$BASE" HEAD -- lsp dap formatters themes agents icons)

          echo "::group::the newest tori, every pack"
          newest=$(.github/scripts/tori-cli.sh newest "$RUNNER_TEMP/newest")
          echo "tori $newest"
          "$RUNNER_TEMP/newest/tori" validate-pack .
          "$RUNNER_TEMP/newest/tori" packs-index .
          if [ -n "$changed" ]; then
            "$RUNNER_TEMP/newest/tori" validate-pack --assets --registry $changed
          fi
          echo "::endgroup::"

          if [ "$oldest" != "$newest" ]; then
            echo "::group::tori $oldest, the packs it supports"
            supported=$(jq -r --arg v "$oldest" '.rows[] | select(.min_tori == $v) | .url | sub("^.*/packs/files/"; "")' index.json)
            .github/scripts/tori-cli.sh "$oldest" "$RUNNER_TEMP/oldest"
            if [ -n "$supported" ]; then
              "$RUNNER_TEMP/oldest/tori" validate-pack $supported
            fi
            echo "::endgroup::"
          fi
